<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerberas celestes para ti</title>
<meta name="description" content="Un ramo de gerberas celestes para ti">
<meta name="theme-color" content="#fdeee9">
<meta property="og:title" content="Gerberas celestes para ti 💙">
<meta property="og:description" content="Abre este ramo, es para ti.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💙%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  html,body{height:100%}

  body{
    min-height:100vh;
    min-height:100svh;
    font-family:"Dancing Script","Snell Roundhand","Segoe Script","Apple Chancery",cursive;
    color:#3b6a8f;
    background:#fdeee9;
    overflow-x:hidden;
  }
  /* Fondo: crema suave que baja a rosa empolvado, con un resplandor claro detrás del ramo */
  body::before{
    content:"";
    position:fixed;top:0;right:0;bottom:0;left:0;
    z-index:-1;
    background:
      radial-gradient(70% 48% at 50% 64%, rgba(255,255,255,.85), rgba(255,255,255,0) 72%),
      linear-gradient(180deg,#fff6ee 0%,#fdebe6 52%,#f8dfe3 100%);
  }

  main{
    position:relative;z-index:1;
    min-height:100vh;
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(env(safe-area-inset-top),16px) 8px max(env(safe-area-inset-bottom),16px);
  }

  .stage{
    width:100%;max-width:460px;
    display:flex;justify-content:center;
  }
  /* El ancho se limita para que ramo + texto siempre quepan en pantalla */
  .stage svg{
    display:block;
    width:min(100%,calc((100vh - 150px) * .69));
    width:min(100%,calc((100svh - 150px) * .69));
    height:auto;
    overflow:visible;
    animation:rise 1.1s ease-out both;
  }

  /* ===== Mensaje (cámbialo en el HTML, en la etiqueta h1) ===== */
  .msg{
    margin-top:6px;
    font-size:clamp(30px,10.5vw,52px);
    font-weight:700;
    line-height:1.15;
    text-align:center;
    white-space:nowrap;
    text-shadow:0 1px 0 rgba(255,255,255,.8);
    opacity:0;
    animation:fade 1.2s ease-out 1.8s forwards;
  }

  /* Corazón: toma el mismo color del texto (currentColor). Para quitarlo, borra el <svg class="heart"> del HTML */
  .heart{
    display:inline-block;
    width:.62em;height:.62em;
    margin-left:.16em;
    vertical-align:-.03em;
    fill:currentColor;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.8));
    transform-origin:center;
    animation:beat 2.6s ease-in-out 3.4s infinite;
  }

  /* ===== Animaciones ===== */
  .bloom{transform-box:fill-box;transform-origin:center;animation:bloom 1.5s cubic-bezier(.2,.8,.2,1.15) var(--d,0s) both}
  #bouquet{transform-box:fill-box;transform-origin:50% 85%;animation:sway 8s ease-in-out 3.2s infinite}

  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes beat{
    0%,36%,100%{transform:scale(1)}
    12%{transform:scale(1.2)}
    24%{transform:scale(1.05)}
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes bloom{
    0%{transform:scale(0) rotate(-50deg);opacity:0}
    35%{opacity:1}
    100%{transform:scale(1) rotate(0deg);opacity:1}
  }
  @keyframes sway{
    0%,100%{transform:rotate(0deg)}
    25%{transform:rotate(-1.1deg)}
    75%{transform:rotate(1.1deg)}
  }

  /* Pétalos que caen suavemente al fondo */
  .fall{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;pointer-events:none;z-index:0}
  .fp{
    position:absolute;top:-30px;opacity:0;
    border-radius:70% 0 70% 0;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translate3d(0,-5vh,0) rotate(0deg);opacity:0}
    10%{opacity:.75}
    90%{opacity:.75}
    100%{transform:translate3d(var(--dx,0),108vh,0) rotate(var(--rot,360deg));opacity:0}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .msg{opacity:1}
    .fall{display:none}
  }
</style>
</head>
<body>

<div class="fall" id="fall" aria-hidden="true"></div>

<main>
  <div class="stage">
    <svg viewBox="22 54 356 516" role="img" aria-label="Ramo de gerberas celestes envuelto en papel azul claro">
      <defs id="defs">
        <linearGradient id="pbL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bddaf0"/><stop offset="1" stop-color="#8ebcdc"/></linearGradient>
        <linearGradient id="pbR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b0d1ea"/><stop offset="1" stop-color="#86b5d8"/></linearGradient>
        <linearGradient id="pfL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbe4f5"/><stop offset="1" stop-color="#8fbbdd"/></linearGradient>
        <linearGradient id="pfR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfdcf1"/><stop offset="1" stop-color="#87b4d8"/></linearGradient>
        <linearGradient id="pfM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcedf9"/><stop offset="1" stop-color="#a6cdea"/></linearGradient>
        <linearGradient id="rib" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#ecdcc6"/></linearGradient>
        <radialGradient id="shadow"><stop offset=".55" stop-color="#2d6498" stop-opacity=".26"/><stop offset="1" stop-color="#2d6498" stop-opacity="0"/></radialGradient>
        <radialGradient id="disc" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#efe88a"/><stop offset=".6" stop-color="#cfc95e"/><stop offset="1" stop-color="#999741"/></radialGradient>
      </defs>

      <g id="bouquet">
        <!-- Papel de atrás -->
        <g id="back">
          <path d="M200 462C118 446 36 352 40 238C42 178 70 132 108 88C118 146 152 188 200 214Z" fill="url(#pbL)"/>
          <path d="M108 88C118 146 152 188 200 214L150 262C108 222 96 160 108 88Z" fill="#fff" opacity=".2"/>
          <path d="M200 462C284 448 366 356 360 244C358 186 332 140 296 100C284 154 250 190 200 214Z" fill="url(#pbR)"/>
          <path d="M296 100C284 154 250 190 200 214L246 268C292 230 306 168 296 100Z" fill="#fff" opacity=".16"/>
          <path d="M40 238C44 330 120 430 200 462C150 400 90 330 78 238Z" fill="#2d6498" opacity=".1"/>
        </g>

        <g id="stems"></g>
        <g id="green"></g>
        <g id="heads"></g>

        <!-- Papel de adelante -->
        <g id="front">
          <path d="M200 560C128 528 62 458 50 338C92 356 154 386 206 424Z" fill="url(#pfL)"/>
          <path d="M200 560C274 530 344 462 352 342C310 358 248 388 194 424Z" fill="url(#pfR)"/>
          <path d="M146 452C170 430 230 430 254 452L200 558Z" fill="url(#pfM)"/>
          <path d="M50 338C92 356 154 386 206 424" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M352 342C310 358 248 388 194 424" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M146 452C170 430 230 430 254 452" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M118 410C130 470 168 520 200 556" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
          <path d="M282 412C270 470 232 520 200 556" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1"/>
          <path d="M200 560C128 528 62 458 50 338C70 440 130 520 200 560Z" fill="#2d6498" opacity=".12"/>
          <path d="M200 560C274 530 344 462 352 342C334 442 272 520 200 560Z" fill="#2d6498" opacity=".12"/>
        </g>

        <!-- Listón -->
        <g id="ribbon" stroke="rgba(120,90,50,.16)" stroke-width=".8">
          <path d="M196 440C186 480 170 510 150 540L166 546C186 520 202 486 206 444Z" fill="url(#rib)"/>
          <path d="M204 440C216 482 236 512 262 536L248 548C222 524 200 488 196 444Z" fill="url(#rib)"/>
          <path d="M200 434C168 398 128 408 136 436C144 458 184 446 200 434Z" fill="url(#rib)"/>
          <path d="M200 434C232 398 272 408 264 436C256 458 216 446 200 434Z" fill="url(#rib)"/>
          <path d="M200 434C176 420 152 420 142 434" fill="none" stroke="rgba(150,110,60,.2)"/>
          <path d="M200 434C224 420 248 420 258 434" fill="none" stroke="rgba(150,110,60,.2)"/>
          <ellipse cx="200" cy="435" rx="11" ry="9" fill="url(#rib)"/>
        </g>

        <g id="gyp-front"></g>
      </g>
    </svg>
  </div>

  <h1 class="msg">Te amo Mi niña<svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2C5.6 17 1.8 13.2 1.8 8.9 1.8 5.9 4.1 3.8 6.8 3.8c2 0 3.8 1.1 5.2 3.1 1.4-2 3.2-3.1 5.2-3.1 2.7 0 5 2.1 5 5.1 0 4.3-3.8 8.1-10.2 12.3z"/></svg></h1>
</main>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  function $(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  /* Números "aleatorios" repetibles: el ramo se ve igual cada vez */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rand = rng(20261013);
  function hex(h) { return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }); }
  function mix(a, b, t) {
    var A = hex(a), B = hex(b);
    return '#' + A.map(function (v, i) {
      return Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0');
    }).join('');
  }

  var defs = document.getElementById('defs');

  /* ===== Tonos de celeste (base del pétalo, medio, punta) ===== */
  var TONES = [
    { b: '#5fa6de', m: '#8cc4ee', t: '#cfe8fa' },  /* 0 celeste medio  */
    { b: '#7db9e8', m: '#aad6f4', t: '#e3f3fd' },  /* 1 celeste claro  */
    { b: '#4a95d2', m: '#78b5e6', t: '#b9ddf6' },  /* 2 celeste intenso */
    { b: '#9ccaee', m: '#c4e2f7', t: '#eef8fe' }   /* 3 casi blanco azulado */
  ];

  /* ===== Capas de pétalos: de afuera hacia el centro ===== */
  var LAYERS = [
    { n: 22, len: 1.00, hw: .082, off: 0,  deep: 0 },
    { n: 20, len: .86,  hw: .080, off: .5, deep: .08 },
    { n: 16, len: .66,  hw: .078, off: 0,  deep: .20 },
    { n: 12, len: .42,  hw: .072, off: .5, deep: .34 }
  ];

  /* Forma de un pétalo largo y delgado de punta redondeada (alto = 1) */
  function petalPath(hw) {
    return 'M0 0C' + (-hw * .55) + ' -.14 ' + (-hw) + ' -.42 ' + (-hw * .96) + ' -.7' +
           'C' + (-hw * .92) + ' -.9 ' + (-hw * .4) + ' -1 0 -1' +
           'C' + (hw * .4) + ' -1 ' + (hw * .92) + ' -.9 ' + (hw * .96) + ' -.7' +
           'C' + hw + ' -.42 ' + (hw * .55) + ' -.14 0 0Z';
  }
  function halfPath(hw) {
    return 'M0 0C' + (hw * .55) + ' -.14 ' + hw + ' -.42 ' + (hw * .96) + ' -.7' +
           'C' + (hw * .92) + ' -.9 ' + (hw * .4) + ' -1 0 -1Z';
  }

  var DEEP = '#2468a8';
  TONES.forEach(function (tn, ti) {
    LAYERS.forEach(function (ly, li) {
      var gid = 'g' + ti + li;
      var lg = $('linearGradient', { id: gid, x1: 0, y1: 1, x2: 0, y2: 0 }, defs);
      $('stop', { offset: 0,   'stop-color': mix(tn.b, DEEP, ly.deep + .12) }, lg);
      $('stop', { offset: .45, 'stop-color': mix(tn.m, DEEP, ly.deep) }, lg);
      $('stop', { offset: 1,   'stop-color': mix(tn.t, DEEP, ly.deep * .6) }, lg);
      var g = $('g', { id: 'p' + ti + li }, defs);
      $('path', { d: petalPath(ly.hw), fill: 'url(#' + gid + ')', stroke: 'rgba(40,100,165,.30)', 'stroke-width': .012 }, g);
      $('path', { d: halfPath(ly.hw), fill: 'rgba(30,90,160,.12)' }, g);
      $('path', { d: 'M0 -.1L0 -.88', fill: 'none', stroke: 'rgba(255,255,255,.45)', 'stroke-width': .014 }, g);
      $('path', { d: 'M' + (-ly.hw * .5) + ' -.12L' + (-ly.hw * .42) + ' -.8', fill: 'none', stroke: 'rgba(255,255,255,.25)', 'stroke-width': .01 }, g);
      $('path', { d: 'M' + (ly.hw * .5) + ' -.12L' + (ly.hw * .42) + ' -.8', fill: 'none', stroke: 'rgba(40,100,165,.18)', 'stroke-width': .01 }, g);
    });
  });

  /* ===== Las gerberas: posición, tamaño (R), giro, aplastado, tono, retraso ===== */
  var FLOWERS = [
    { x: 200, y: 150, R: 54, rot: 10,  k: .97, tone: 0, d: .70 },
    { x: 125, y: 192, R: 50, rot: -20, k: .95, tone: 3, d: .85 },
    { x: 279, y: 186, R: 52, rot: 25,  k: .96, tone: 2, d: .95 },
    { x: 92,  y: 278, R: 44, rot: 15,  k: .92, tone: 2, d: 1.15 },
    { x: 310, y: 274, R: 46, rot: -10, k: .93, tone: 3, d: 1.25 },
    { x: 200, y: 252, R: 58, rot: 0,   k: 1,   tone: 1, d: .50 },
    { x: 150, y: 320, R: 44, rot: 30,  k: .92, tone: 0, d: 1.40 },
    { x: 255, y: 322, R: 46, rot: -25, k: .93, tone: 2, d: 1.50 }
  ];

  var stems = document.getElementById('stems');
  var green = document.getElementById('green');
  var heads = document.getElementById('heads');
  var gypFront = document.getElementById('gyp-front');

  /* Tallos que salen del mismo punto, bajo el listón */
  FLOWERS.forEach(function (f) {
    var cx = 200 + (f.x - 200) * .35, cy = 440 - (440 - f.y) * .55;
    $('path', { d: 'M200 442Q' + cx + ' ' + cy + ' ' + f.x + ' ' + f.y, fill: 'none', stroke: '#6f9f7c', 'stroke-width': 4.5, 'stroke-linecap': 'round' }, stems);
  });

  /* Ramitas de eucalipto */
  var LEAF = ['#8fbaa0', '#a9cdb4', '#79a88c', '#b9d6c0'];
  function sprig(x0, y0, cx, cy, x1, y1, n, r0) {
    $('path', { d: 'M' + x0 + ' ' + y0 + 'Q' + cx + ' ' + cy + ' ' + x1 + ' ' + y1, fill: 'none', stroke: '#7aa588', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, green);
    for (var i = 0; i < n; i++) {
      var t = .3 + .7 * (i + 1) / n, mt = 1 - t;
      var px = mt * mt * x0 + 2 * mt * t * cx + t * t * x1;
      var py = mt * mt * y0 + 2 * mt * t * cy + t * t * y1;
      var dx = 2 * mt * (cx - x0) + 2 * t * (x1 - cx);
      var dy = 2 * mt * (cy - y0) + 2 * t * (y1 - cy);
      var ang = Math.atan2(dy, dx) * 180 / Math.PI;
      var side = i % 2 ? 1 : -1;
      var r = r0 * (1 - .55 * t);
      $('ellipse', {
        cx: 0, cy: 0, rx: (r * 1.05).toFixed(1), ry: (r * .74).toFixed(1), fill: LEAF[i % LEAF.length],
        transform: 'translate(' + px.toFixed(1) + ' ' + py.toFixed(1) + ') rotate(' + (ang + side * 55).toFixed(1) + ') translate(' + r.toFixed(1) + ' 0)'
      }, green);
    }
    $('ellipse', { cx: 0, cy: 0, rx: (r0 * .5).toFixed(1), ry: (r0 * .36).toFixed(1), fill: LEAF[1],
      transform: 'translate(' + x1 + ' ' + y1 + ') rotate(' + (Math.atan2(y1 - cy, x1 - cx) * 180 / Math.PI).toFixed(1) + ')' }, green);
  }
  sprig(200, 440, 70, 360, 30, 190, 7, 17);
  sprig(200, 440, 340, 360, 372, 184, 7, 17);
  sprig(200, 440, 140, 230, 140, 70, 6, 15);
  sprig(200, 440, 266, 220, 262, 76, 6, 15);
  sprig(200, 440, 50, 420, 28, 296, 5, 15);
  sprig(200, 440, 350, 430, 376, 308, 5, 15);

  /* Nube de gypsophila (flor blanca pequeña) */
  function gyp(parent, x, y, spread) {
    var n = 5;
    for (var i = 0; i < n; i++) {
      var a = (-90 + (i - (n - 1) / 2) * spread / (n - 1)) * Math.PI / 180;
      var l = 26 + rand() * 14;
      var ex = x + Math.cos(a) * l, ey = y + Math.sin(a) * l;
      $('path', { d: 'M' + x + ' ' + (y + 14) + 'Q' + ((x + ex) / 2) + ' ' + ((y + ey) / 2) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1), fill: 'none', stroke: '#8fb394', 'stroke-width': .9 }, parent);
      for (var j = 0; j < 4; j++) {
        var ox = ex + (rand() - .5) * 12, oy = ey + (rand() - .5) * 12;
        $('circle', { cx: ox.toFixed(1), cy: oy.toFixed(1), r: (1.6 + rand() * 1.6).toFixed(1), fill: '#fff', stroke: 'rgba(110,150,180,.3)', 'stroke-width': .4 }, parent);
      }
    }
  }
  gyp(green, 160, 112, 70);
  gyp(green, 244, 116, 70);
  gyp(green, 66, 238, 80);
  gyp(green, 340, 230, 80);
  gyp(gypFront, 94, 346, 70);
  gyp(gypFront, 312, 350, 70);

  /* Gerberas */
  FLOWERS.forEach(function (f) {
    var g = $('g', { transform: 'translate(' + f.x + ' ' + f.y + ') rotate(' + f.rot + ') scale(1 ' + f.k + ')' }, heads);
    var b = $('g', { 'class': 'bloom', style: '--d:' + f.d + 's' }, g);
    $('circle', { cx: 2, cy: 5, r: (f.R * .98).toFixed(1), fill: 'url(#shadow)' }, b);

    LAYERS.forEach(function (ly, li) {
      var step = 360 / ly.n;
      for (var i = 0; i < ly.n; i++) {
        var a = (i + ly.off) * step + (rand() - .5) * step * .5;
        var sy = f.R * ly.len * (1 + (rand() - .5) * .14);
        var sx = f.R * (1 + (rand() - .5) * .16);
        $('use', { href: '#p' + f.tone + li, transform: 'rotate(' + a.toFixed(1) + ') scale(' + sx.toFixed(2) + ' ' + sy.toFixed(2) + ')' }, b);
      }
    });

    /* Centro: anillo oscuro, disco verde-amarillo y puntitos */
    var c = f.R, i, ang, rr;
    $('circle', { r: (c * .235).toFixed(1), fill: '#58693a' }, b);
    $('circle', { r: (c * .19).toFixed(1), fill: 'url(#disc)' }, b);
    for (i = 0; i < 20; i++) {
      ang = i / 20 * Math.PI * 2 + rand() * .2; rr = c * (.12 + rand() * .02);
      $('circle', { cx: (Math.cos(ang) * rr).toFixed(1), cy: (Math.sin(ang) * rr).toFixed(1), r: (c * .016).toFixed(2), fill: '#7a742d', opacity: .8 }, b);
    }
    for (i = 0; i < 8; i++) {
      ang = i / 8 * Math.PI * 2 + rand() * .3; rr = c * .06;
      $('circle', { cx: (Math.cos(ang) * rr).toFixed(1), cy: (Math.sin(ang) * rr).toFixed(1), r: (c * .014).toFixed(2), fill: '#7a742d', opacity: .85 }, b);
    }
    $('circle', { r: (c * .035).toFixed(1), fill: '#6a6a2a' }, b);
  });

  /* ===== Pétalos que caen en el fondo ===== */
  var fall = document.getElementById('fall');
  var cols = [['#bfe0f7', '#8fc6ee'], ['#ffffff', '#e4f2fc'], ['#a9d4f3', '#78b7e8']];
  for (var i = 0; i < 14; i++) {
    var p = document.createElement('i');
    p.className = 'fp';
    var s = 8 + rand() * 12, cc = cols[i % cols.length];
    p.style.cssText =
      'left:' + (rand() * 100).toFixed(1) + '%;' +
      'width:' + s.toFixed(1) + 'px;height:' + (s * 1.5).toFixed(1) + 'px;' +
      'background:linear-gradient(135deg,' + cc[0] + ',' + cc[1] + ');' +
      '--dx:' + ((rand() - .5) * 120).toFixed(0) + 'px;' +
      '--rot:' + (180 + rand() * 360).toFixed(0) + 'deg;' +
      'animation-duration:' + (14 + rand() * 12).toFixed(1) + 's;' +
      'animation-delay:-' + (rand() * 20).toFixed(1) + 's';
    fall.appendChild(p);
  }
})();
</script>
</body>
</html>
